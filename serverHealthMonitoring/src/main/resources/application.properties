spring.application.name=serverHealthMonitoring

server.port=8081

# Database Connection
spring.datasource.url=jdbc:postgresql://localhost:5432/health_monitor_db
spring.datasource.username=postgres
spring.datasource.password=admin

# Hibernate Settings
# 'update' automatically creates/updates tables based on your @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Set retention policy (default to 7 days)
metrics.retention.days=7

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-16-digit-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 1. STOP Hibernate from printing every single SQL query
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 2. Set the global log level to WARN (hides Spring/Hibernate noise)
logging.level.root=WARN

# 3. Set YOUR project to INFO (shows only your custom messages)
# Replace 'com.project.serverHealthMonitoring' with your actual base package
logging.level.com.project.serverHealthMonitoring=INFO

# 4. Make the log format clean and readable
logging.pattern.console=%d{HH:mm:ss} %-5level --- %msg%n